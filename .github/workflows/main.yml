name: Build Samsung Browser Portable

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Get latest version
      id: version
      shell: pwsh
      run: |
        $release = Invoke-RestMethod "https://api.github.com/repos/hoangxg4/samsung_browser-offline-installer/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -match "SamsungInternet_Offline" } | Select-Object -First 1
        
        $newVersion = "143.0.0.95"
        $downloadUrl = ""
        
        if ($asset) {
          $filename = $asset.name
          if ($filename -match "v?([\d\.]+)") {
            $newVersion = $matches[1]
          }
          $downloadUrl = $asset.browser_download_url
        }
        
        Write-Host "New version: $newVersion"
        Write-Host "Download URL: $downloadUrl"
        Write-Host "##vso[task.setvariable variable=version;isOutput=true]$newVersion"
        Write-Host "##vso[task.setvariable variable=downloadUrl;isOutput=true]$downloadUrl"

    - name: Check current version
      id: current
      shell: pwsh
      run: |
        $currentVersion = ""
        if (Test-Path "version.txt") {
          $currentVersion = Get-Content "version.txt" -Raw -ErrorAction SilentlyContinue
          $currentVersion = $currentVersion.Trim()
        }
        
        $newVersion = "${{ steps.version.outputs.version }}"
        
        Write-Host "Current: '$currentVersion'"
        Write-Host "New: '$newVersion'"
        
        $shouldBuild = "true"
        if ($currentVersion -ne "" -and $currentVersion -eq $newVersion) {
          $shouldBuild = "false"
        }
        
        Write-Host "Should build: $shouldBuild"
        Write-Host "##vso[task.setvariable variable=shouldBuild;isOutput=true]$shouldBuild"

    - name: Checkout
      if: steps.current.outputs.shouldBuild == 'true'
      uses: actions/checkout@v4

    - name: Download 7zr
      if: steps.current.outputs.shouldBuild == 'true'
      run: curl -sSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe

    - name: Download Samsung Browser
      if: steps.current.outputs.shouldBuild == 'true'
      run: curl -sSL "${{ steps.version.outputs.downloadUrl }}" -o samsung.zip

    - name: Extract and Build
      if: steps.current.outputs.shouldBuild == 'true'
      shell: pwsh
      run: |
        $version = "${{ steps.version.outputs.version }}"
        
        # Giải nén samsung.zip
        Write-Host "Extracting samsung.zip..."
        Expand-Archive -Path samsung.zip -DestinationPath temp -Force
        
        # Tìm mini_installer.exe
        $mini = Get-ChildItem -Path temp -Filter "mini_installer.exe" -Recurse | Select-Object -First 1
        if (-not $mini) { 
          Write-Host "ERROR: mini_installer.exe not found"
          exit 1 
        }
        Write-Host "Found: $($mini.Name)"
        
        # Giải nén mini_installer
        Write-Host "Extracting mini_installer..."
        & .\7zr.exe x $mini.FullName "-otemp2" -y | Out-Null
        
        # Tìm samsunginternet.7z
        $seven = Get-ChildItem -Path temp2 -Filter "*.7z" -Recurse | Select-Object -First 1
        if (-not $seven) { 
          Write-Host "ERROR: samsunginternet.7z not found"
          exit 1 
        }
        Write-Host "Found: $($seven.Name)"
        
        # Giải nén samsunginternet.7z -> Chrome-bin
        Write-Host "Extracting Chrome-bin..."
        & .\7zr.exe x $seven.FullName "-oChrome-bin" -y | Out-Null
        
        # Tạo thư mục SamsungBrowser
        New-Item -Force -Type Directory SamsungBrowser | Out-Null
        Move-Item -Path Chrome-bin SamsungBrowser/ -Force
        
        # Copy các file cần thiết
        Copy-Item chrome++.ini SamsungBrowser/ -Force
        Copy-Item debloater.reg SamsungBrowser/ -Force
        Copy-Item update.bat SamsungBrowser/ -Force
        
        # Tạo thư mục Data/Cache
        New-Item -Force -Type Directory SamsungBrowser/Data | Out-Null
        New-Item -Force -Type Directory SamsungBrowser/Cache | Out-Null
        
        # Lưu version
        Set-Content -Path version.txt -Value $version -Encoding utf8
        
        # Nén
        $zipName = "SamsungBrowser-$version.zip"
        Write-Host "Creating $zipName..."
        Compress-Archive -Path SamsungBrowser $zipName -Force
        
        # Cleanup
        Remove-Item samsung.zip,temp,temp2 -Recurse -Force -ErrorAction SilentlyContinue
        
        Write-Host "Done!"

    - name: Release
      if: steps.current.outputs.shouldBuild == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: SamsungBrowser-${{ steps.version.outputs.version }}.zip
        tag_name: v${{ steps.version.outputs.version }}
        name: Samsung Browser v${{ steps.version.outputs.version }}
        body: |
          📥 **Tải về, giải nén và dùng ngay!**
          
          ### Hướng dẫn:
          1. Tải file zip ở dưới
          2. Giải nén
          3. Chạy `SamsungBrowser.exe` hoặc vào `Chrome-bin` chạy `samsunginternet.exe`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
