name: Build Samsung Browser Portable

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build and Process
      id: build_step
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # 1. Đọc phiên bản hiện tại từ Repo
        $currentLocalVersion = "0.0.0.0"
        if (Test-Path "version.txt") {
            $currentLocalVersion = (Get-Content "version.txt").Trim()
        }
        Write-Host "Phien ban hien tai trong Repo: $currentLocalVersion"

        # 2. Lấy thông tin phiên bản Samsung mới nhất từ Repo gốc
        $release = Invoke-RestMethod "https://api.github.com/repos/hoangxg4/samsung_browser-offline-installer/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -match "SamsungInternet_Offline" } | Select-Object -First 1
        
        if (-not $asset) { 
            Write-Error "Khong tim thay ban thiet lap offline tren Repo goc."
            exit 1 
        }

        $newVersion = ""
        if ($asset.name -match "v?(\d[\d\.]+\d)") { $newVersion = $matches[1] }
        $newVersion = $newVersion.Trim().Trim('.')
        $downloadUrl = $asset.browser_download_url
        $tag = "v$newVersion"
        $zipName = "SamsungBrowser-$newVersion.zip"

        Write-Host "Phien ban moi nhat online: $newVersion"

        # 3. Kiem tra xem co can Build khong
        if ($newVersion -eq $currentLocalVersion -and $env:EVENT_NAME -eq "schedule") {
            Write-Host "Khong co ban moi. Dang bo qua..."
            echo "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
        }

        # Neu chay thu cong, xoa Release cu de ghi de
        if ($env:EVENT_NAME -ne "schedule") {
            gh release delete $tag --yes 2>$null
            git push origin :refs/tags/$tag 2>$null
        }

        # --- TỰ ĐỘNG FETCH CHROME++ (version.dll) ---
        Write-Host "Dang lay link tai Chrome++..."
        $plusRelease = Invoke-RestMethod "https://api.github.com/repos/bibicadotnet/Chromium_SetDLL/releases/latest"
        $plusUrl = ($plusRelease.assets | Where-Object { $_.name -like "Chrome*.7z" } | Select-Object -First 1).browser_download_url

        # 4. Tai file va cong cu
        curl.exe -sSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe
        Write-Host "Dang tai bo cai Samsung..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile samsung.zip -UserAgent "SamsungBrowser"
        
        Write-Host "Dang tai Chrome++..."
        Invoke-WebRequest -Uri $plusUrl -OutFile chrome_plus.7z

        # 5. Giai nen da tang
        Write-Host "Dang giai nen bo cai Samsung..."
        New-Item -ItemType Directory -Force -Path "temp_work" | Out-Null
        Expand-Archive -Path samsung.zip -DestinationPath "temp_work\l1" -Force
        $mini = Get-ChildItem -Path "temp_work\l1" -Filter "mini_installer.exe" -Recurse | Select-Object -First 1
        & .\7zr.exe x $mini.FullName "-otemp_work\l2" -y | Out-Null
        $sevenZ = Get-ChildItem -Path "temp_work\l2" -Filter "*.7z" -Recurse | Select-Object -First 1
        & .\7zr.exe x $sevenZ.FullName "-otemp_work\extracted" -y | Out-Null
        
        Write-Host "Dang giai nen Chrome++..."
        & .\7zr.exe x chrome_plus.7z "-otemp_plus" -y | Out-Null

        # Tim thu muc Chrome-bin thuc te
        $sourceDir = Get-ChildItem -Path "temp_work\extracted" -Directory -Recurse | Where-Object { $_.Name -eq "Chrome-bin" } | Select-Object -First 1
        
        # 6. Thiet lap cau truc Portable
        $portableRoot = "SamsungBrowser_Portable"
        $browserDir = Join-Path $portableRoot "Samsung_Browser"
        New-Item -Force -Type Directory $browserDir | Out-Null
        
        # Di chuyen loi trinh duyet
        Move-Item -Path "$($sourceDir.FullName)\*" -Destination $browserDir -Force
        
        # COPY version.dll x64 tu bo cai Chrome++ vao trinh duyet
        $dll = Get-ChildItem -Path "temp_plus" -Recurse -Filter "version.dll" | Where-Object { $_.FullName -match '\\x64\\App\\' } | Select-Object -First 1
        if ($dll) {
            Write-Host "Da copy version.dll tu Repo Chrome++!"
            Copy-Item $dll.FullName $browserDir -Force
        } else {
            Write-Warning "Khong tim thay version.dll x64!"
        }

        # 7. XU LY ENCODING VA COPY FILE CONFIG (Fix loi font)
        $configFiles = @("default-apps-multi-profile.bat", "update.bat", "chrome++.ini", "debloater.reg")
        
        foreach ($file in $configFiles) {
            if (Test-Path $file) {
                Write-Host "Dang fix encoding cho $file..."
                $content = Get-Content -Path $file -Raw
                $destPath = Join-Path $browserDir $file
                
                if ($file.EndsWith(".bat") -or $file.EndsWith(".reg")) {
                    $content | Out-File -FilePath $destPath -Encoding ascii -Force
                } else {
                    $content | Out-File -FilePath $destPath -Encoding utf8 -Force
                }
            }
        }
        
        # Tao thu muc du lieu nguoi dung
        New-Item -Force -Type Directory (Join-Path $browserDir "Data") | Out-Null
        New-Item -Force -Type Directory (Join-Path $browserDir "Cache") | Out-Null

        # 8. Dong goi ZIP
        Write-Host "Dang nen file ZIP..."
        Compress-Archive -Path "$portableRoot/*" -DestinationPath $zipName -Force

        # 9. Don dep rác
        Remove-Item 7zr.exe, samsung.zip, chrome_plus.7z, temp_work, temp_plus, $portableRoot -Recurse -Force -ErrorAction SilentlyContinue

        # Gui du lieu sang cac buoc sau
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
        echo "version=$newVersion" >> $env:GITHUB_OUTPUT
        echo "zip_path=$zipName" >> $env:GITHUB_OUTPUT
        echo "skip=false" >> $env:GITHUB_OUTPUT

    - name: Update Version File
      if: steps.build_step.outputs.skip != 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        echo "${{ steps.build_step.outputs.version }}" > version.txt
        git add version.txt
        git commit -m "Build version ${{ steps.build_step.outputs.version }} [skip ci]" --allow-empty
        git push origin main

    - name: Create GitHub Release
      if: steps.build_step.outputs.skip != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.build_step.outputs.tag }}
        name: Samsung Browser ${{ steps.build_step.outputs.version }}
        files: ${{ steps.build_step.outputs.zip_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          📥 **Samsung Browser Portable v${{ steps.build_step.outputs.version }}**
          
          *(Tích hợp sẵn Chrome++ phiên bản mới nhất)*

          ### Hướng dẫn:
          1. Tải file ZIP bên dưới và giải nén.
          2. Vào thư mục `Samsung_Browser`.
          3. Chạy `samsunginternet.exe` để sử dụng.
          
          ### Công cụ đi kèm:
          - `default-apps-multi-profile.bat`: Đặt làm trình duyệt mặc định (Chạy Admin).
          - `update.bat`: Cập nhật phiên bản mới tự động.
          - `debloater.reg`: Tối ưu hóa quyền riêng tư và hiệu năng.
          
          ---
          *Build tự động bởi GitHub Actions*
