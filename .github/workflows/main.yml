name: Build Samsung Browser Portable

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build and Process
      id: build_step
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # 1. Lấy thông tin phiên bản
        $release = Invoke-RestMethod "https://api.github.com/repos/hoangxg4/samsung_browser-offline-installer/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -match "SamsungInternet_Offline" } | Select-Object -First 1
        
        $newVersion = "143.0.0.95"
        if ($asset) {
            if ($asset.name -match "v?(\d[\d\.]+\d)") { 
                $newVersion = $matches[1] 
            }
            $downloadUrl = $asset.browser_download_url
        }
        
        $newVersion = $newVersion.Trim().Trim('.')
        $tag = "v$newVersion"
        $zipName = "SamsungBrowser-$newVersion.zip"

        Write-Host "Version: $newVersion"

        # 2. Kiểm tra release
        if ($env:EVENT_NAME -eq "schedule") {
            $existing = gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) {
                Write-Host "Release $tag exists, skipping..."
                echo "skip=true" >> $env:GITHUB_OUTPUT
                exit 0
            }
        } else {
            Write-Host "Manual trigger - deleting old release..."
            gh release delete $tag --yes 2>$null
            git push origin :refs/tags/$tag 2>$null
        }

        # 3. Tải file
        curl -sSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe
        Write-Host "Downloading..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile samsung.zip -UserAgent "SamsungBrowser"
        
        # 4. Giải nén và Xử lý cấu trúc
        Write-Host "Extracting..."
        Expand-Archive -Path samsung.zip -DestinationPath temp -Force
        
        # Tìm và xả mini_installer
        $mini = Get-ChildItem -Path temp -Filter "mini_installer.exe" -Recurse | Select-Object -First 1
        & .\7zr.exe x $mini.FullName "-otemp2" -y | Out-Null
        
        # Tìm và xả samsunginternet.7z
        $seven = Get-ChildItem -Path temp2 -Filter "*.7z" -Recurse | Select-Object -First 1
        & .\7zr.exe x $seven.FullName "-otemp_chrome" -y | Out-Null
        
        # Tìm thư mục browser gốc (thường là Chrome-bin bên trong file nén)
        $sourceDir = Get-ChildItem -Path temp_chrome -Directory -Recurse | Where-Object { $_.Name -eq "Chrome-bin" } | Select-Object -First 1
        if (-not $sourceDir) {
            $sourceDir = Get-ChildItem -Path temp_chrome -Directory | Select-Object -First 1
        }

        # Tạo thư mục gốc của bộ Portable
        $portableRoot = "SamsungBrowser_Portable"
        New-Item -Force -Type Directory $portableRoot | Out-Null
        
        # Di chuyển và đổi tên thư mục browser thành Samsung_Browser
        $browserDir = Join-Path $portableRoot "Samsung_Browser"
        Move-Item -Path $sourceDir.FullName -Destination $browserDir -Force
        
        # 5. Copy các file config VÀO TRONG thư mục Samsung_Browser
        # Bao gồm chrome++.ini, version.dll (nếu có), v.v.
        @("chrome++.ini", "version.dll", "chrome++.dll", "debloater.reg", "update.bat") | ForEach-Object {
            if (Test-Path $_) { 
                Write-Host "Copying $_ to Samsung_Browser..."
                Copy-Item $_ $browserDir -Force 
            }
        }
        
        # Tạo Data và Cache bên trong thư mục browser để đảm bảo tính Portable (tùy chọn)
        New-Item -Force -Type Directory (Join-Path $browserDir "Data") | Out-Null
        New-Item -Force -Type Directory (Join-Path $browserDir "Cache") | Out-Null
        
        # 6. Nén - Nén thư mục SamsungBrowser_Portable
        Write-Host "Compressing..."
        Compress-Archive -Path "$portableRoot/*" -DestinationPath $zipName -Force

        # 7. Cleanup
        Remove-Item 7zr.exe, samsung.zip, temp, temp2, temp_chrome, $portableRoot -Recurse -Force -ErrorAction SilentlyContinue

        # Output
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
        echo "version=$newVersion" >> $env:GITHUB_OUTPUT
        echo "zip_path=$zipName" >> $env:GITHUB_OUTPUT
        echo "skip=false" >> $env:GITHUB_OUTPUT

    - name: Push Version Update
      if: steps.build_step.outputs.skip != 'true'
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        echo "${{ steps.build_step.outputs.version }}" > version.txt
        git add version.txt
        git commit -m "Build ${{ steps.build_step.outputs.tag }} [skip ci]" --allow-empty
        git push origin main

    - name: Create GitHub Release
      if: steps.build_step.outputs.skip != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.build_step.outputs.tag }}
        name: Samsung Browser ${{ steps.build_step.outputs.version }}
        files: ${{ steps.build_step.outputs.zip_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          📥 **Samsung Browser Portable v${{ steps.build_step.outputs.version }}**
          
          ### Cấu trúc file:
          - Đã đổi tên thư mục browser thành `Samsung_Browser`.
          - Đã tích hợp `chrome++.ini` và các file bổ trợ trực tiếp vào thư mục browser.
          
          ### Hướng dẫn:
          1. Tải file ZIP bên dưới.
          2. Giải nén.
          3. Vào thư mục `Samsung_Browser` và chạy `samsunginternet.exe`.
          
          ---
          *Tự động đóng gói bởi CezDev Bot*
