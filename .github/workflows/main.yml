name: Build Samsung Browser Portable

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build and Process
      id: build_step
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # 1. Lấy thông tin phiên bản từ Source
        try {
            $release = Invoke-RestMethod "https://api.github.com/repos/hoangxg4/samsung_browser-offline-installer/releases/latest"
            $asset = $release.assets | Where-Object { $_.name -match "SamsungInternet_Offline" } | Select-Object -First 1
            
            $newVersion = "143.0.0.95" # Dự phòng
            if ($asset) {
                if ($asset.name -match "v?(\d[\d\.]+\d)") { 
                    $newVersion = $matches[1] 
                }
                $downloadUrl = $asset.browser_download_url
            }
        } catch {
            Write-Error "Failed to fetch version from API."
            exit 1
        }
        
        $newVersion = $newVersion.Trim().Trim('.')
        $tag = "v$newVersion"
        $zipName = "SamsungBrowser-$newVersion.zip"

        Write-Host "Detected Version: $newVersion"
        Write-Host "Triggered by: $env:EVENT_NAME"

        # 2. Logic kiểm tra/xóa Release cũ
        if ($env:EVENT_NAME -eq "schedule") {
            $existing = gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) {
                Write-Host "Status: Version $tag already exists. Skipping Cron build."
                echo "skip=true" >> $env:GITHUB_OUTPUT
                exit 0
            }
        } else {
            Write-Host "Status: Manual trigger. Force deleting old release/tag $tag..."
            gh release delete $tag --yes 2>$null
            git push origin :refs/tags/$tag 2>$null
        }

        # 3. Chuẩn bị công cụ & Tải file
        curl -sSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe
        Write-Host "Downloading installer..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile samsung.zip -UserAgent "SamsungBrowser"
        
        # 4. Giải nén và Xử lý cấu trúc Portable
        Write-Host "Extracting files..."
        Expand-Archive -Path samsung.zip -DestinationPath temp -Force
        $mini = Get-ChildItem -Path temp -Filter "mini_installer.exe" -Recurse | Select-Object -First 1
        & .\7zr.exe x $mini.FullName "-otemp2" -y | Out-Null
        
        $seven = Get-ChildItem -Path temp2 -Filter "*.7z" -Recurse | Select-Object -First 1
        & .\7zr.exe x $seven.FullName "-oChrome-bin" -y | Out-Null
        
        # Tạo thư mục đích
        New-Item -Force -Type Directory SamsungBrowser | Out-Null
        Move-Item -Path Chrome-bin SamsungBrowser/ -Force
        
        # Copy các file config đi kèm (nếu có trong repo)
        $extraFiles = @("chrome++.ini", "debloater.reg", "update.bat")
        foreach ($file in $extraFiles) {
            if (Test-Path $file) {
                Copy-Item $file SamsungBrowser/ -Force
            }
        }
        New-Item -Force -Type Directory SamsungBrowser/Data, SamsungBrowser/Cache | Out-Null
        
        # 5. Đóng gói ZIP
        Write-Host "Compressing to $zipName..."
        Compress-Archive -Path SamsungBrowser/* -DestinationPath $zipName -Force

        # 6. Dọn dẹp file rác để không bị commit nhầm
        Remove-Item 7zr.exe, samsung.zip, temp, temp2, SamsungBrowser -Recurse -Force -ErrorAction SilentlyContinue

        # Output kết quả
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
        echo "version=$newVersion" >> $env:GITHUB_OUTPUT
        echo "zip_path=$zipName" >> $env:GITHUB_OUTPUT
        echo "skip=false" >> $env:GITHUB_OUTPUT

    - name: Push Version Update
      if: steps.build_step.outputs.skip != 'true'
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        echo "${{ steps.build_step.outputs.version }}" > version.txt
        git add version.txt
        git commit -m "Build ${{ steps.build_step.outputs.tag }} [skip ci]" --allow-empty
        git push origin main

    - name: Create GitHub Release
      if: steps.build_step.outputs.skip != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.build_step.outputs.tag }}
        name: Samsung Browser ${{ steps.build_step.outputs.version }}
        files: ${{ steps.build_step.outputs.zip_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          📥 **Samsung Browser Portable v${{ steps.build_step.outputs.version }}**
          
          ### Hướng dẫn:
          1. Tải file ZIP bên dưới.
          2. Giải nén vào thư mục bất kỳ.
          3. Chạy `samsunginternet.exe` trong thư mục `Chrome-bin`.
          
          ---
          *Tự động đóng gói bởi CezDev Bot*
          *Build Date: ${{ github.event.repository.updated_at }}*
          *Trigger: ${{ github.event_name }}*
