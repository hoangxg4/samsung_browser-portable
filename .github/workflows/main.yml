name: Build Samsung Browser Portable

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Build and Process
      id: build_step
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        # 1. Lấy thông tin phiên bản
        $release = Invoke-RestMethod "https://api.github.com/repos/hoangxg4/samsung_browser-offline-installer/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -match "SamsungInternet_Offline" } | Select-Object -First 1
        
        $newVersion = "143.0.0.95"
        if ($asset) {
            if ($asset.name -match "v?(\d[\d\.]+\d)") { $newVersion = $matches[1] }
            $downloadUrl = $asset.browser_download_url
        }
        $newVersion = $newVersion.Trim().Trim('.')
        $tag = "v$newVersion"
        $zipName = "SamsungBrowser-$newVersion.zip"

        # 2. Xử lý Release cũ (nếu chạy thủ công)
        if ($env:EVENT_NAME -ne "schedule") {
            gh release delete $tag --yes 2>$null
            git push origin :refs/tags/$tag 2>$null
        } elseif (gh release view $tag 2>$null) {
            Write-Host "Release $tag already exists. Skipping."
            echo "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
        }

        # 3. Tải và giải nén trình duyệt
        curl.exe -sSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe
        Invoke-WebRequest -Uri $downloadUrl -OutFile samsung.zip -UserAgent "SamsungBrowser"
        
        New-Item -ItemType Directory -Force -Path "temp_raw" | Out-Null
        Expand-Archive -Path samsung.zip -DestinationPath "temp_raw\l1" -Force
        $mini = Get-ChildItem -Path "temp_raw\l1" -Filter "mini_installer.exe" -Recurse | Select-Object -First 1
        & .\7zr.exe x $mini.FullName "-otemp_raw\l2" -y | Out-Null
        $sevenZ = Get-ChildItem -Path "temp_raw\l2" -Filter "*.7z" -Recurse | Select-Object -First 1
        & .\7zr.exe x $sevenZ.FullName "-otemp_raw\extracted" -y | Out-Null
        
        $sourceChromeBin = Get-ChildItem -Path "temp_raw\extracted" -Directory -Recurse | Where-Object { $_.Name -eq "Chrome-bin" } | Select-Object -First 1

        # 4. Thiết lập cấu trúc Samsung_Browser
        $portableRoot = "SamsungBrowser_Portable"
        $browserDir = Join-Path $portableRoot "Samsung_Browser"
        New-Item -Force -Type Directory $browserDir | Out-Null
        
        # Di chuyển ruột của Chrome-bin vào Samsung_Browser
        Move-Item -Path "$($sourceChromeBin.FullName)\*" -Destination $browserDir -Force

        # 5. XỬ LÝ MÃ HÓA FILE (FIX LỖI FONT)
        # Danh sách các file text cần fix encoding
        $textFiles = @("default-apps-multi-profile.bat", "update.bat", "chrome++.ini", "debloater.reg")
        
        foreach ($file in $textFiles) {
            if (Test-Path $file) {
                Write-Host "Fixing encoding for $file..."
                $content = Get-Content -Path $file -Raw
                
                # File .bat và .reg nên dùng ASCII hoặc UTF8 (No BOM) để CMD đọc chuẩn
                if ($file.EndsWith(".bat") -or $file.EndsWith(".reg")) {
                    $content | Out-File -FilePath (Join-Path $browserDir $file) -Encoding ascii -Force
                } else {
                    $content | Out-File -FilePath (Join-Path $browserDir $file) -Encoding utf8 -Force
                }
            }
        }

        # Copy các file nhị phân (như .dll) nếu có
        if (Test-Path "version.dll") { Copy-Item "version.dll" $browserDir -Force }

        # Tạo sẵn Data/Cache rỗng
        New-Item -Force -Type Directory (Join-Path $browserDir "Data"), (Join-Path $browserDir "Cache") | Out-Null

        # 6. Đóng gói và Cleanup
        Compress-Archive -Path "$portableRoot/*" -DestinationPath $zipName -Force
        Remove-Item 7zr.exe, samsung.zip, temp_raw, $portableRoot -Recurse -Force -ErrorAction SilentlyContinue

        # Output variables
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
        echo "version=$newVersion" >> $env:GITHUB_OUTPUT
        echo "zip_path=$zipName" >> $env:GITHUB_OUTPUT
        echo "skip=false" >> $env:GITHUB_OUTPUT

    - name: Push version update
      if: steps.build_step.outputs.skip != 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        echo "${{ steps.build_step.outputs.version }}" > version.txt
        git add version.txt
        git commit -m "Update to ${{ steps.build_step.outputs.tag }} [skip ci]" --allow-empty
        git push origin main

    - name: Create Release
      if: steps.build_step.outputs.skip != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.build_step.outputs.tag }}
        name: Samsung Browser ${{ steps.build_step.outputs.version }}
        files: ${{ steps.build_step.outputs.zip_path }}
        token: ${{ secrets.GITHUB_TOKEN }}
