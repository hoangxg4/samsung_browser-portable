name: Build Samsung Browser Portable

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Thêm permissions để GitHub Actions có quyền tạo release và đẩy code
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup GitHub CLI
      run: |
        gh --version || winget install github.cli --accept-source-agreements --accept-package-agreements

    - name: Download 7zr
      run: curl -sSL https://www.7-zip.org/a/7zr.exe -o 7zr.exe

    - name: Build and Release
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. Lấy thông tin phiên bản
        $release = Invoke-RestMethod "https://api.github.com/repos/hoangxg4/samsung_browser-offline-installer/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -match "SamsungInternet_Offline" } | Select-Object -First 1
        
        $newVersion = "143.0.0.95"
        if ($asset) {
            if ($asset.name -match "v?([\d\.]+)") {
                $newVersion = $matches[1]
            }
            $downloadUrl = $asset.browser_download_url
        }
        
        $tag = "v$newVersion"
        Write-Host "Target Version: $newVersion"
        
        # 2. Kiểm tra release tồn tại (Sử dụng try/catch để tránh lỗi dừng workflow)
        $existing = gh release view $tag 2>$null
        if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, skipping..."
            exit 0
        }
        
        # 3. Chuẩn bị file và xử lý
        Set-Content -Path version.txt -Value $newVersion -Encoding utf8
        Write-Host "Downloading from $downloadUrl..."
        Invoke-WebRequest -Uri $downloadUrl -OutFile samsung.zip -UserAgent "SamsungBrowser"
        
        Write-Host "Extracting..."
        Expand-Archive -Path samsung.zip -DestinationPath temp -Force
        $mini = Get-ChildItem -Path temp -Filter "mini_installer.exe" -Recurse | Select-Object -First 1
        & .\7zr.exe x $mini.FullName "-otemp2" -y | Out-Null
        
        $seven = Get-ChildItem -Path temp2 -Filter "*.7z" -Recurse | Select-Object -First 1
        & .\7zr.exe x $seven.FullName "-oChrome-bin" -y | Out-Null
        
        New-Item -Force -Type Directory SamsungBrowser | Out-Null
        Move-Item -Path Chrome-bin SamsungBrowser/ -Force
        
        # Lưu ý: Các file chrome++.ini, debloater.reg, update.bat phải có sẵn trong repo
        Copy-Item chrome++.ini,debloater.reg,update.bat SamsungBrowser/ -Force -ErrorAction SilentlyContinue
        New-Item -Force -Type Directory SamsungBrowser/Data,SamsungBrowser/Cache | Out-Null
        
        $zipName = "SamsungBrowser-$newVersion.zip"
        Compress-Archive -Path SamsungBrowser $zipName -Force
        
        # 4. Git Push & Tag
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add version.txt
        git commit -m "Release $tag"
        git push
        git tag $tag
        git push origin $tag
        
        # 5. Tạo Release (Fix lỗi YAML bằng cách gán note vào biến)
        $releaseNotes = @"
        📥 **Tải về, giải nén và dùng ngay!**

        ### Hướng dẫn:
        1. Tải file zip bên dưới.
        2. Giải nén.
        3. Chạy SamsungBrowser.exe hoặc vào Chrome-bin chạy samsunginternet.exe.
        "@

        gh release create $tag $zipName --title "Samsung Browser $newVersion" --notes "$releaseNotes"
        
        Write-Host "Successfully built and released $tag"
